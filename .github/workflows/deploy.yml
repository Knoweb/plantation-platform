name: Deploy to DigitalOcean
# Triggering workflow
on:
  push:
    branches:
      - main
      - dev-isuru

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          envs: GITHUB_TOKEN,BRANCH_NAME
          command_timeout: 60m
          script: |
            REPO_URL="https://oauth2:${GITHUB_TOKEN}@github.com/Knoweb/plantation-platform.git"
            
            if [ ! -d "/root/plantation-platform" ]; then
              git clone -b $BRANCH_NAME $REPO_URL /root/plantation-platform
            else
              cd /root/plantation-platform
              git remote set-url origin $REPO_URL
            fi
            
            cd /root/plantation-platform
            
            # Take a database backup before pulling new code and deploying
            echo "Triggering pre-deployment database backup..."
            docker exec pgbackups /backup.sh || echo "pgbackups container not running, skipping pre-deploy backup"
            
            # Fetch latest
            git fetch origin $BRANCH_NAME
            git reset --hard origin/$BRANCH_NAME
            
            # Step 1: Pre-build new images sequentially on the server to prevent RAM exhaustion and swapping
            echo "Building discovery-server..."
            docker compose -f docker-compose.prod.yml build discovery-server
            
            echo "Building api-gateway..."
            docker compose -f docker-compose.prod.yml build api-gateway
            
            echo "Building tenant-service..."
            docker compose -f docker-compose.prod.yml build tenant-service
            
            echo "Building inventory-service..."
            docker compose -f docker-compose.prod.yml build inventory-service
            
            echo "Building operation-service..."
            docker compose -f docker-compose.prod.yml build operation-service
            
            echo "Building frontend..."
            docker compose -f docker-compose.prod.yml build frontend
            
            # Step 2: Spin up the new V2 containers perfectly alongside the old V1 containers
            docker compose -f docker-compose.prod.yml up -d --scale api-gateway=2 --scale frontend=2 --scale tenant-service=2 --scale inventory-service=2 --scale operation-service=2 --no-recreate
            
            # Step 3: Wait 30 seconds for the new Java backend contexts to boot
            sleep 30
            
            # Step 4: Gracefully terminate the old V1 containers leaving only the new ones
            docker compose -f docker-compose.prod.yml up -d --scale api-gateway=1 --scale frontend=1 --scale tenant-service=1 --scale inventory-service=1 --scale operation-service=1 --remove-orphans
            
            # Force restart Nginx to pick up config changes
            docker compose -f docker-compose.prod.yml restart nginx
            
            # Prune unused images to save space
            docker image prune -a -f
